<body>
    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="container">
            <div class="nav-content">
                <div class="nav-brand"></div>

                <div class="nav-links desktop-nav">
                    <a href="#home" class="nav-link"></a>
                    <a href="#about" class="nav-link"></a>
                    <a href="#experience" class="nav-link"></a>

    <!-- Hero Section -->
    <section id="home" class="hero">
        <div class="container">
            <div class="hero-grid">
                <div class="hero-content">
                    <h1 class="hero-title"></h1>
                    <h3 class="hero-subtitle"></h3>
                    <h4 class="hero-input"></h4>
                    <div class="hero-cta-box">
                        <input type="text" class="input" placeholder="" readonly>
                        <a href="#contact" class="btn btn-hero"></a>
                    </div>
                </div>
                <div class="hero-image">
                    <img src="Hero Image.jpg" alt="">
                </div>
            </div>
        </div>
    </section>

    <!-- About Section -->
    <section id="about" class="section bg-white">
        <div class="container">
            <div class="about-grid">
                <div class="about-image-wrapper">
                    <img src="About Image.jpg" alt="" class="about-image">
                </div>
                <div class="about-content-wrapper">
                    <h2 class="section-title"></h2>
                    <h3 class="about-heading"></h3>
                    <p class="about-text"></p>
                    <div class="about-stats-grid">
                        <div class="about-stat-box">
                            <div class="stat-number">+15</div>
                            <div class="stat-label"></div>
                        </div>
                        <div class="about-stat-box">
                            <div class="stat-number">3</div>
                            <div class="stat-label"></div>
                        </div>
                        <div class="about-stat-box">
                            <div class="stat-number">+100</div>
                            <div class="stat-label"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Experience Timeline -->
    <section id="experience" class="section bg-gray">
        <div class="container">
            <h2 class="section-title"></h2>
            <div class="timeline">
                <div class="timeline-item">
                    <div class="timeline-dot"></div>
                    <div class="timeline-content">
                        <div class="timeline-year"></div>
                        <h3 class="timeline-role"></h3>
                        <p class="timeline-desc"></p>
                    </div>
                </div>
                <div class="timeline-item">
                    <div class="timeline-dot"></div>
                    <div class="timeline-content">
                        <div class="timeline-year"></div>
                        <h3 class="timeline-role"></h3>
                        <p class="timeline-desc"></p>
                    </div>
                </div>
                <div class="timeline-item">
                    <div class="timeline-dot"></div>
                    <div class="timeline-content">
                        <div class="timeline-year"></div>
                        <h3 class="timeline-role"></h3>
                        <p class="timeline-desc"></p>
                    </div>
                </div>
                <div class="timeline-item">
                    <div class="timeline-dot"></div>
                    <div class="timeline-content">
                        <div class="timeline-year"></div>
                        <h3 class="timeline-role"></h3>
                        <p class="timeline-desc"></p>
                    </div>
                </div>
                <div class="timeline-item">
                    <div class="timeline-dot"></div>
                    <div class="timeline-content">
                        <div class="timeline-year"></div>
                        <h3 class="timeline-role"></h3>
                        <p class="timeline-desc"></p>
                    </div>
                </div>
                <div class="timeline-item">
                    <div class="timeline-dot"></div>
                    <div class="timeline-content">
                        <div class="timeline-year"></div>
                        <h3 class="timeline-role"></h3>
                        <p class="timeline-desc"></p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Services Section -->
    <section id="services" class="section bg-white">
        <div class="container">
            <h2 class="section-title">Services</h2>
            <div class="services-grid">
                <div class="service-card">
                    <div class="service-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
                        </svg>
                    </div>
                    <h3 class="service-title"></h3>
                    <p class="service-desc"></p>
                </div>
                <div class="service-card">
                    <div class="service-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                        </svg>
                    </div>
                    <h3 class="service-title"></h3>
                    <p class="service-desc"></p>
                </div>
                <div class="service-card">
                    <div class="service-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1 .6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"></path>
                            <path d="M19.38 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.9.94 5.34 2.81 7.76"></path>

                            <path d="M12 10v4"></path>

                    <p class="service-desc"></p>
                </div>
                <div class="service-card">
                    <div class="service-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                            <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
                        </svg>
                    </div>
                    <h3 class="service-title"></h3>
                    <p class="service-desc"></p>

                <div class="service-card">
                    <div class="service-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
                            <polyline points="16 7 22 7 22 13"></polyline>
                        </svg>
                    </div>
                    <h3 class="service-title"></h3>
                    <p class="service-desc"></p>
                </div>
            </div>
        </div>
    </section>

    <!-- Why Me Section -->
    <section id="why" class="section bg-gray">
        <div class="container">
            <h2 class="section-title"></h2>
            <div class="why-carousel">
                <div class="why-carousel-track">
                    <div class="why-carousel-item active">
                        <div class="why-icon-large">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                                <path d="M2 17l10 5 10-5M2 12l10 5 10-5"></path>
                            </svg>
                        </div>
                        <h3 class="why-carousel-title"></h3>
                        <p class="why-carousel-text"></p>
                    </div>
                    <div class="why-carousel-item">
                        <div class="why-icon-large">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
                            </svg>
                        </div>
                        <h3 class="why-carousel-title"></h3>
                        <p class="why-carousel-text"></p>
                    </div>
                    <div class="why-carousel-item">
                        <div class="why-icon-large">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="8" r="7"></circle>
                                <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline>
                            </svg>
                        </div>
                        <h3 class="why-carousel-title"></h3>
                        <p class="why-carousel-text"></p>
                    </div>
                </div>
                <div class="why-carousel-dots">
                    <button class="carousel-dot active" data-index="0"></button>
                    <button class="carousel-dot" data-index="1"></button>
                    <button class="carousel-dot" data-index="2"></button>
                </div>
            </div>
        </div>
    </section>

    <!-- Certifications Section -->
    <section id="certifications" class="section bg-white">
        <div class="container">
            <div class="cert-header">
                <h2 class="section-title"></h2>
                <p class="cert-subtitle"></p>
            </div>
            <div class="cert-showcase">
                <div class="cert-premium-card">
                    <div class="cert-badge">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"></path>
                        </svg>
                    </div>
                    <h3 class="cert-premium-title"></h3>
                    <ul class="cert-premium-list">
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                    </ul>
                </div>
                <div class="cert-premium-card">
                    <div class="cert-badge">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                            <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
                        </svg>
                    </div>
                    <h3 class="cert-premium-title"></h3>
                    <ul class="cert-premium-list">
                        <li></li>
                        <li></li>
                        <li></li>
                    </ul>
                </div>
            </div>
        </div>
    </section>

    <!-- Testimonials Section -->
    <section id="testimonials" class="section bg-gray">
        <div class="container">
            <h2 class="section-title"> </h2>
            <div class="testimonials-grid">
                <div class="testimonial-card">
                    <div class="testimonial-header">
                        <div class="testimonial-avatar">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                                <circle cx="9" cy="7" r="4"></circle>
                                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                            </svg>
                        </div>
                        <div>
                            <h3 class="testimonial-name"></h3>
                            <p class="testimonial-role"></p>

                <div class="testimonial-card">
                    <div class="testimonial-header">
                        <div class="testimonial-avatar">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

                                <circle cx="9" cy="7" r="4"></circle>
                                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>

                            </svg>

                        <div>
                            <h3 class="testimonial-name"></h3>
                            <p class="testimonial-role"></p>
                        </div>
                    </div>
                    <p class="testimonial-text"></p>
                </div>
                <div class="testimonial-card">
                    <div class="testimonial-header">
                        <div class="testimonial-avatar">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                                <circle cx="9" cy="7" r="4"></circle>
                                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                            </svg>
                        </div>
                        <div>
                            <h3 class="testimonial-name"></h3>
                            <p class="testimonial-role"></p>
                        </div>
                    </div>
                    <p class="testimonial-text"></p>
                </div>
            </div>
        </div>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="section bg-white contact-compact">
        <div class="container">
            <h2 class="section-title"></h2>
            <p class="contact-subtitle"></p>
            
            <div class="contact-split">
                <div class="contact-form-wrapper">
                    <h3 class="contact-form-title"></h3>
                    <form class="contact-form" id="contactForm">
                        <div class="form-group">
                            <label for="name" class="form-label"></label>
                            <input type="text" id="name" name="name" class="form-input" required>
                        </div>
                        <div class="form-group">
                            <label for="email" class="form-label"></label>
                            <input type="email" id="email" name="email" class="form-input" required>
                        </div>
                        <div class="form-group">
                            <label for="message" class="form-label"></label>
                            <textarea id="message" name="message" class="form-textarea" rows="4" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary btn-full"></button>
                    </form>
                </div>

                <div class="contact-info-wrapper">
                    <h3 class="contact-info-title"></h3>
                    <p class="contact-info-desc"></p>
                    
                    <div class="contact-info-list">
                        <div class="contact-info-item">
                            <div class="contact-info-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                                    <circle cx="12" cy="10" r="3"></circle>
                                </svg>
                            </div>
                            <div>
                                <h4 class="contact-info-label"></h4>
                                <p class="contact-info-text"></p>
                            </div>
                        </div>

                        <div class="contact-info-item">
                            <div class="contact-info-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                                </svg>
                            </div>
                            <div>
                                <h4 class="contact-info-label">Phone</h4>
                                <a href="" class="contact-info-text contact-info-link"></a>
                            </div>
                        </div>

                        <div class="contact-info-item">
                            <div class="contact-info-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                    <polyline points="22,6 12,13 2,6"></polyline>
                                </svg>
                            </div>
                            <div>
                                <h4 class="contact-info-label">Email</h4>
                                <a href="mailto:contact@ironnetix.com" class="contact-info-text contact-info-link">contact@ironnetix.com</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <p class="footer-text"></p>
                <div class="footer-links">
                    <a href="#home" class="footer-link"></a>
                    <a href="#about" class="footer-link"></a>
                    <a href="#experience" class="footer-link"></a>
                    <a href="#services" class="footer-link"></a>
                    <a href="#why" class="footer-link"></a>
                    <a href="#certifications" class="footer-link"></a>
                    <a href="#testimonials" class="footer-link"></a>
                    <a href="#contact" class="footer-link"></a>
                </div>
            </div>
        </div>
